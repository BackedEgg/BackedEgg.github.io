<h3><br>writeup:</h3>
<p>&nbsp;웹페이지를&nbsp;들어가서&nbsp;할&nbsp;수&nbsp;있는&nbsp;것은&nbsp;비밀번호&nbsp;변경,&nbsp;로그인&nbsp;확인이었고&nbsp;그&nbsp;외에도&nbsp;로그보기(임시)에서&nbsp;정보를&nbsp;얻을&nbsp;수&nbsp;있었다. <br>우선&nbsp;비밀번호&nbsp;변경은&nbsp;login&nbsp;required가&nbsp;뜨며&nbsp;가능하지&nbsp;않았다. </p>
<p><br>로그보기로&nbsp;들어가면&nbsp;session&nbsp;에&nbsp;대한&nbsp;정보를&nbsp;볼&nbsp;수&nbsp;있었는데&nbsp;admin&nbsp;session도&nbsp;볼&nbsp;수&nbsp;있었다.&nbsp;이&nbsp;세션을&nbsp;application&nbsp;에&nbsp;cookie에&nbsp;입력해서&nbsp;비밀번호를&nbsp;바꾸고&nbsp;로그인을&nbsp;하니&nbsp;flag가&nbsp;떴다.</p>
